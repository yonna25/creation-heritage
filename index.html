<style>

<script>
// Liens des groupes : renseigner un lien (WhatsApp, Telegram, Discord…) par niveau

let S={done:{}};try{S=JSON.parse(localStorage.getItem('ceh')||'{"done":{}}')}catch(e){}
const save=()=>{try{localStorage.setItem('ceh',JSON.stringify(S))}catch(e){}sync()};
const $=document.getElementById('app'),e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let curTab,cur=null,step=0,qi=0,pick=null,ans=0,tmp={};
const ML=m=>L.map((l,i)=>i).filter(i=>L[i].m===m);
const cm=()=>S.cm>=0&&S.cm<M.length?S.cm:0;
const li=i=>ML(L[i].m).indexOf(i)+1;
const unlocked=i=>!L[i].soon&&(i==0||L[i].m!==L[i-1].m||!!S.done[L[i-1].id]);
const nDone=()=>ML(cm()).filter(i=>S.done[L[i].id]).length;
function setM(k){S.cm=k;save();home()}
const lvRow=i=>{const l=L[i],d=S.done[l.id];return`<div class="lv ${d?'':'lock'}" ${unlocked(i)?`onclick="start(${i})"`:''}><div class="ic">${d?'✓':li(i)}</div><div class="t"><b>${l.n}</b>${d?`<small>${l.q}</small>`:l.soon?'<small>Bientôt disponible</small>':''}</div>${d?'<span class="ch">›</span>':LK}</div>`};
function home(){cur=null;const m=cm(),ix=ML(m),n=nDone(),nx=ix.find(i=>!S.done[L[i].id]&&!L[i].soon),real=ix.filter(i=>!L[i].soon).length;
const chips=M.length>1?`<div class="mu" role="button" tabindex="0" onclick="themes()" style="margin:14px 0 0;cursor:pointer">${e(M[m].n)} · ${e(M[m].t)} <u>changer</u></div>`:'';
shell(chips+`${nx!==undefined?`<div class="card hero"><div class="chain">Niveau ${ix.indexOf(nx)+1} sur ${ix.length}</div><h2>${L[nx].n}</h2><div class="mu">${L[nx].q}</div><button onclick="start(${nx})">${n?'Continuer le parcours':'Commencer le parcours'}</button></div>`:real?`<div class="card hero"><h2>${e(M[m].n)} terminé</h2><div class="mu">Tu as parcouru toutes les étapes de ce module.</div><button onclick="summary()">Voir ma synthèse</button></div>`:`<div class="card hero"><div class="chain">${e(M[m].n)}</div><h2>${e(M[m].t)}</h2><div class="mu">Ce module sera bientôt disponible.</div></div>`}
<div>${ix.map(i=>i===nx?'':lvRow(i)).join('')}</div>
<details class="set"><summary>Réglages</summary><div class="card"><b>Ton prénom (facultatif)</b><input id="nm" value="${e(S.name||'')}" placeholder="Prénom ou pseudo" onchange="S.name=this.value.trim();save()" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)"><div class="note">Tes réponses et engagements sont transmis de façon confidentielle à l'équipe du parcours pour améliorer les contenus.</div></div>
<button class="sec" onclick="reset()" style="font-size:14px">Réinitialiser ma progression</button></details>`,'p',nx)}
function groups(){const G=GR();shell(`<h1>Groupes</h1><p class="mu">Échange et approfondis chaque niveau avec d'autres participants.</p>`+L.map((l,i)=>{if(l.soon)return'';const g=G[l.id]||{},t=ok(g.t),w=ok(g.w);return(li(i)==1&&M.length>1?`<h2>${e(M[l.m].n)} · ${e(M[l.m].t)}</h2>`:'')+`<div class="card"><b>${li(i)} · ${l.n}</b>`+(!S.done[l.id]?`<div class="mu">Termine d'abord le niveau ${li(i)} - ${l.n} pour accéder à ce groupe.</div>`:(!t&&!w?'<div class="mu">Bientôt disponible.</div>':(t?`<a class="btn" style="background:#5aa9e0" href="${e(g.t)}" target="_blank" rel="noopener">Telegram</a>`:'')+(w?`<a class="btn" style="background:#4caf7a" href="${e(g.w)}" target="_blank" rel="noopener">WhatsApp</a>`:'')))+'</div>'}).join(''),'g')}
function summary(){const n=L.filter(l=>S.done[l.id]).length,full=ML(0).every(i=>S.done[L[i].id]);cur=null;shell(`<h1>Ma synthèse</h1><p class="mu">${full?"Tu as parcouru toute la route de la création à l'héritage. Voici ce que tu retiens et ce que tu as décidé.":n?"Voici ce que tu retiens jusqu'ici.":"Ta synthèse apparaîtra ici dès ton premier niveau terminé."}</p>`+L.filter(l=>S.done[l.id]).map(l=>{const p=S.p[l.id];return`<div class="card"><b>${l.n}</b> ${(l.z||[]).length?`<span class="mu">· quiz ${p.sc}/${l.z.length}</span>`:''}<p><i>${e(p.s)}</i></p><p class="mu">Engagement : ${e(p.e)}</p>${p.u?`<p class="mu">Ma formulation : ${e(p.u)}</p>`:''}${l.nt&&l.df?`<p><b>${l.nt}</b> : ${l.df}</p>`:''}</div>`}).join('')+(full?`<div class="card"><div class="chain">${CH}</div>${L.filter(l=>l.m===0&&l.nt&&l.sq).map(l=>`<p><b>${l.nt}</b><br><span class="mu">${l.sq}</span></p>`).join('')}<p class="mu">Ces six notions forment une seule route : chacune prépare la suivante.</p></div><div class="syn">« J'ai appris une question que je dois désormais me poser. J'ai pris un engagement. Et si je veux aller plus loin, je peux le faire avec d'autres. »</div>`:''),'s')}
function themes(v){cur=null;if(v!==undefined){S.cm=+v;save()}const m=cm(),ix=ML(m),real=ix.filter(i=>!L[i].soon).length;
shell(`<h1>Thèmes</h1><p class="mu">Choisis un thème : ses niveaux d'étude apparaissent.</p><label for="th" class="chain">Thème</label><select id="th" onchange="themes(this.value)">${M.map((x,k)=>{const q=ML(k).filter(i=>!L[i].soon),d=q.filter(i=>S.done[L[i].id]).length;return`<option value="${k}" ${k==m?'selected':''}>${e(x.n)} · ${e(x.t)}${q.length?` (${d}/${q.length})`:''}</option>`}).join('')}</select><p class="mu">${real?`${real} niveau${real>1?'x':''} d'étude`:'Bientôt disponible'}</p><div>${ix.map(lvRow).join('')}</div>`,'t')}
function start(i){S.cm=L[i].m;cur=i;step=0;qi=0;pick=null;ans=0;tmp={};render()}
const segs=h=>`<div class="seg">${ML(cm()).map(i=>`<span class="sg ${S.done[L[i].id]?'on':i===h?'h':''}" ${unlocked(i)?`onclick="start(${i})"`:''}><i></i></span>`).join('')}</div>`;
const head=(l,i,t)=>segs(i)+`<button class="back" onclick="home()">← Parcours</button><div class="chain">Niveau ${li(i)} · ${l.n}</div><div class="mu">Étape ${step+1} sur 8 - ${t}</div>`;
const LK='<svg class="lk" viewBox="0 0 24 24" aria-label="Verrouillé"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const IC={p:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/>',s:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',t:'<path d="M4 6h16M4 12h16M4 18h10"/>',g:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 5"/>'};
function shell(h,tab,hi){curTab=tab;const T=[['p','Parcours','home()'],['t','Thèmes','themes()'],['s','Synthèse','summary()'],['g','Groupes','groups()']];
$.innerHTML=segs(hi)+h+`<div class="nav">${T.map(t=>`<div class="${t[0]==tab?'a':''}" onclick="${t[2]}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</div>`).join('')}</div>`;window.scrollTo(0,0)}
function intro(){cur=null;$.innerHTML=`<div class="intro"><div class="chain">Parcours biblique</div><h1 class="big">De la <i>création</i> à l’<i>héritage</i></h1><p class="mu lead">Découvre ton identité, ta position et ton héritage en CHRIST.<br>Un parcours en 6 étapes pour aller plus loin dans la Parole.</p><div class="tl">${ML(0).map(i=>`<div class="tp">${L[i].n}</div>`).join('')}</div><button class="cta" onclick="S.seen=1;save();home()"><span>Commencer</span><span>→</span></button><div class="mu" style="text-align:center;font-size:13px">Environ 10 minutes par niveau</div></div>`;window.scrollTo(0,0)}
function render(){const l=L[cur],i=cur,P=S.p&&S.p[l.id]||{};if(step==3&&!(l.z&&l.z.length))step=4;if(step==6&&!l.vq)step=7;
if(step==0)$.innerHTML=head(l,i,'La question clé')+`<h1>${l.q}</h1><p class="mu">Apprends à te poser cette question avant de chercher la réponse.</p><button onclick="go(1)">Découvrir →</button>`;
else if(step==1)$.innerHTML=head(l,i,'Découverte biblique')+(l.p||[]).map(v=>`<div class="v"><b>${v[0]}</b>${v[1]}</div>`).join('')+`<button onclick="go(2)">Continuer →</button>`;
else if(step==2)$.innerHTML=head(l,i,'Réflexion')+`<h2>${l.r}</h2>${l.d?`<button class="xp" id="xp" aria-expanded="false" aria-controls="pn" onclick="explore()"><span id="xpt">Explorer</span><small>Des questions pour aller plus loin dans ta réflexion.</small></button><div class="panel" id="pn" hidden><div class="chain">Pour approfondir ta réflexion</div><ul>${l.d.map(q=>`<li>${q}</li>`).join('')}</ul><div class="rl">${l.rl}</div><button class="sec back2" onclick="explore(1)">↓ Revenir à ma réponse</button></div>`:''}<textarea id="t" placeholder="Écris ta réponse…">${e(P.r||'')}</textarea><div class="note">Au moins quelques mots sincères : il n'y a pas de bonne ou mauvaise réponse.</div><button id="b" onclick="saveText('r',3)">Valider →</button>`;
else if(step==3){const z=l.z[qi];$.innerHTML=head(l,i,`Quiz ${qi+1}/${l.z.length}`)+`<h2>${z[0]}</h2>`+z[1].map((o,k)=>`<button class="sec opt" id="o${k}" onclick="choose(${k})">${o}</button>`).join('')+`<div class="fb" id="fb"></div><button id="b" disabled onclick="check()">Valider</button>`}
else if(step==4)$.innerHTML=head(l,i,'Synthèse')+`<div class="syn">${l.s}</div><h2>En une phrase, qu'as-tu compris de ce niveau ?</h2><textarea id="t" placeholder="Ce que je retiens…">${e(P.s||'')}</textarea><button id="b" onclick="saveText('s',5)">Valider →</button>`;
else if(step==5)$.innerHTML=head(l,i,'Engagement')+`<h2>Qu'est-ce que tu décides de faire à partir de ce que tu viens de comprendre ?</h2><textarea id="t" placeholder="Ma décision…">${e(P.e||'')}</textarea><button id="b" onclick="saveText('e',6)">Valider mon engagement →</button>`;
else if(step==6)$.innerHTML=head(l,i,'Ce que je dois maintenant comprendre')+`<div class="chain">${l.nt}</div><h2>${l.vq}</h2><textarea id="t" placeholder="Avec mes mots…">${e(P.u||'')}</textarea><div class="note">Écris ce que tu as compris, puis compare avec la définition de référence.</div><button id="b" onclick="verify()">Valider et comparer →</button><div id="cmp"></div>`;
else{const p=S.p[l.id],g=GR()[l.id]||{};S.done[l.id]=1;S.p[l.id].sc=ans;save();
$.innerHTML=head(l,i,'Approfondissement')+`<h1>🎉 Niveau terminé</h1><div class="card">${(l.z||[]).length?`<b>Quiz :</b> ${ans}/${l.z.length}<br><br>`:''}<b>Ce que tu retiens :</b><br>${e(p.s)}<br><br><b>Ton engagement :</b><br>${e(p.e)}</div><p class="mu">Compréhension, réflexion, engagement : le score n'est qu'un critère parmi d'autres.</p><h2>Veux-tu aller plus loin ?</h2>
<button onclick="${(()=>{const q=ML(l.m),nn=q[q.indexOf(i)+1];return nn!==undefined&&!L[nn].soon?`start(${nn})`:'summary()'})()}">🔵 Continuer seul<br><small>Poursuivre le parcours</small></button>
${grpBtns(g,l)}
<button class="sec" onclick="home()">🟠 Revenir plus tard</button>`}
window.scrollTo(0,0);if(step==7)fireworks()}
function fireworks(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const old=document.getElementById('fw');if(old)old.remove();
const cv=document.createElement('canvas');cv.id='fw';cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';document.body.appendChild(cv);
const x=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
const col=['#d4a85f','#f4ead9','#6fcf97','#5aa9e0','#ff8a75','#f2c94c'];let P=[],R=[],t0=performance.now(),last=t0,nx=0;
function burst(cx,cy){const c=col[Math.random()*col.length|0],n=46;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,s=(1.5+Math.random()*3.2)*dpr;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function launch(){R.push({x:(.15+Math.random()*.7)*W,y:H,ty:(.12+Math.random()*.3)*H,v:-(7+Math.random()*3)*dpr})}
function f(now){const dt=Math.min((now-last)/16.7,3);last=now;const el=now-t0;
x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
