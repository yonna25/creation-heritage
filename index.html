<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14213a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Création-Héritage"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>De la création à l'héritage</title>
<style>
:root{--bg:#14213a;--card:#1d2d4d;--tx:#f3eddc;--mu:#a9b3c7;--ac:#d9b45f;--ac2:#2c3d63;--ok:#7fd1a0;--ko:#f08a7a;--bd:#2c3d63;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:22px 18px 60px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.15;margin:.2em 0 .3em;font-weight:500}h2{font-size:22px;margin:.4em 0;font-weight:500}
.mu{color:var(--mu);font-size:15px}.chain{color:var(--ac);font-size:13px;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:14px 0}
.v{border-left:3px solid var(--ac);padding:2px 0 2px 14px;margin:14px 0;font-style:italic}.v b{display:block;font-style:normal;font-size:14px;color:var(--ac)}
button,.btn{font:inherit;font-weight:bold;display:block;width:100%;text-align:left;background:var(--ac);color:var(--bg);border:0;border-radius:14px;padding:15px 16px;margin:10px 0;cursor:pointer;transition:transform .12s}
button:active,.btn:active,.lv:active{transform:scale(.98)}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:normal}
button:disabled{opacity:.45;cursor:default}
button.opt.sel{border-color:var(--ac);background:var(--ac2)}button.opt.good{border-color:var(--ok);background:var(--ac2)}button.opt.bad{border-color:var(--ko)}
textarea,input{font:inherit;color:var(--tx)}
textarea{width:100%;min-height:110px;border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--card)}
.seg{display:flex;gap:6px;margin:18px 0 6px}.seg i{flex:1;height:4px;border-radius:4px;background:var(--ac2)}.seg i.on{background:var(--ac)}
.hero h2{font-size:24px;margin:4px 0}
.lv{display:flex;gap:14px;align-items:center;padding:13px 14px;margin:8px 0;border:1px solid var(--bd);border-radius:16px;background:var(--card);cursor:pointer;transition:transform .12s}
.lv.lock{opacity:.45;cursor:default}.lv.cur{border-color:var(--ac)}
.ic{font-size:17px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ac2);color:var(--ac)}
.lv.cur .ic{background:var(--ac);color:var(--bg)}.lv .t{flex:1}.lv small{display:block;color:var(--mu)}.ch{color:var(--ac);font-size:22px}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0 0 6px;font-size:15px;font-weight:normal}
.bar{height:5px;background:var(--ac2);border-radius:5px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.syn{font-size:20px;text-align:center;padding:24px 16px;background:var(--ac2);border-radius:18px;margin:16px 0}
.fb{font-size:15px;margin:8px 0}.note{font-size:14px;color:var(--mu);margin-top:6px}
</style></head><body><main id="app"></main>
<script src="config.js"></script><script src="content.js"></script>
<script>
// Liens des groupes : renseigner un lien (WhatsApp, Telegram, Discord…) par niveau
const GROUPS={origine:'',relation:'',identite:'',statut:'',position:'',heritage:''};
const CH="Origine → Relation → Identité → Statut → Position → Héritage";
let S={done:{}};try{S=JSON.parse(localStorage.getItem('ceh')||'{"done":{}}')}catch(e){}
const save=()=>{try{localStorage.setItem('ceh',JSON.stringify(S))}catch(e){}sync()};
const $=document.getElementById('app'),e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null,step=0,qi=0,pick=null,ans=0,tmp={};
const unlocked=i=>i==0||S.done[L[i-1].id];
const nDone=()=>L.filter(l=>S.done[l.id]).length;
function home(){cur=null;const n=nDone(),nx=L.findIndex(l=>!S.done[l.id]);
$.innerHTML=`<div class="chain">PARCOURS BIBLIQUE</div><h1>De la création à l'héritage</h1><p class="mu">Six étapes, une seule question à la fois.</p>
<div class="seg">${L.map(l=>`<i class="${S.done[l.id]?'on':''}"></i>`).join('')}</div><div class="mu" style="margin-bottom:14px">${n} niveau${n>1?'x':''} terminé${n>1?'s':''} sur 6</div>
${nx>=0?`<div class="card hero"><div class="chain">TON PARCOURS · ${n} SUR 6</div><h2>Niveau ${nx+1} · ${L[nx].n}</h2><div class="mu">${L[nx].q}</div><button onclick="start(${nx})">${n?'Continuer le parcours':'Commencer le parcours'}</button></div>`:`<div class="card hero"><h2>Parcours terminé</h2><div class="mu">Tu as parcouru les six étapes.</div><button onclick="summary()">Voir ma synthèse</button></div>`}
${L.map((l,i)=>`<div class="lv ${S.done[l.id]?'':i==nx?'cur':'lock'}" ${unlocked(i)?`onclick="start(${i})"`:''}><div class="ic">${S.done[l.id]?'✓':i+1}</div><div class="t"><b>${l.n}</b><small>${l.q}</small></div>${unlocked(i)?'<span class="ch">›</span>':''}</div>`).join('')}
<div class="card"><b>Ton prénom (facultatif)</b><input id="nm" value="${e(S.name||'')}" placeholder="Prénom ou pseudo" onchange="S.name=this.value.trim();save()" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)"><div class="note">Tes réponses et engagements sont transmis de façon confidentielle à l'équipe du parcours pour améliorer les contenus.</div></div>
${n>0?`<button class="sec" onclick="summary()">Ma synthèse personnelle</button>`:''}
<button class="sec" onclick="reset()" style="font-size:14px">Réinitialiser ma progression</button>`}
function start(i){cur=i;step=0;qi=0;pick=null;ans=0;tmp={};render()}
const head=(l,i,t)=>`<button class="back" onclick="home()">← Parcours</button><div class="chain">Niveau ${i+1} · ${l.n}</div><div class="bar"><i style="width:${(step+1)/7*100}%"></i></div><div class="mu">Étape ${step+1}/7 — ${t}</div>`;
function render(){const l=L[cur],i=cur,P=S.p&&S.p[l.id]||{};
if(step==0)$.innerHTML=head(l,i,'La question clé')+`<h1>${l.q}</h1><p class="mu">Apprends à te poser cette question avant de chercher la réponse.</p><button onclick="go(1)">Découvrir →</button>`;
else if(step==1)$.innerHTML=head(l,i,'Découverte biblique')+l.p.map(v=>`<div class="v"><b>${v[0]}</b>${v[1]}</div>`).join('')+`<button onclick="go(2)">Continuer →</button>`;
else if(step==2)$.innerHTML=head(l,i,'Réflexion')+`<h2>${l.r}</h2><textarea id="t" placeholder="Écris ta réponse…">${e(P.r||'')}</textarea><div class="note">Au moins quelques mots sincères : il n'y a pas de bonne ou mauvaise réponse.</div><button id="b" onclick="saveText('r',3)">Valider →</button>`;
else if(step==3){const z=l.z[qi];$.innerHTML=head(l,i,`Quiz ${qi+1}/${l.z.length}`)+`<h2>${z[0]}</h2>`+z[1].map((o,k)=>`<button class="sec opt" id="o${k}" onclick="choose(${k})">${o}</button>`).join('')+`<div class="fb" id="fb"></div><button id="b" disabled onclick="check()">Valider</button>`}
else if(step==4)$.innerHTML=head(l,i,'Synthèse')+`<div class="syn">${l.s}</div><h2>En une phrase, qu'as-tu compris de ce niveau ?</h2><textarea id="t" placeholder="Ce que je retiens…">${e(P.s||'')}</textarea><button id="b" onclick="saveText('s',5)">Valider →</button>`;
else if(step==5)$.innerHTML=head(l,i,'Engagement')+`<h2>Qu'est-ce que tu décides de faire à partir de ce que tu viens de comprendre ?</h2><textarea id="t" placeholder="Ma décision…">${e(P.e||'')}</textarea><button id="b" onclick="saveText('e',6)">Valider mon engagement →</button>`;
else{const p=S.p[l.id],g=GR()[l.id]||{};S.done[l.id]=1;S.p[l.id].sc=ans;save();
$.innerHTML=head(l,i,'Approfondissement')+`<h1>🎉 Niveau terminé</h1><div class="card"><b>Quiz :</b> ${ans}/${l.z.length}<br><br><b>Ce que tu retiens :</b><br>${e(p.s)}<br><br><b>Ton engagement :</b><br>${e(p.e)}</div><p class="mu">Compréhension, réflexion, engagement : le score n'est qu'un critère parmi d'autres.</p><h2>Veux-tu aller plus loin ?</h2>
<button onclick="${i<5?`start(${i+1})`:'summary()'}">🔵 Continuer seul<br><small>Poursuivre le parcours</small></button>
${grpBtns(g,l)}
<button class="sec" onclick="home()">🟠 Revenir plus tard</button>`}
window.scrollTo(0,0)}
function go(n){step=n;render()}
function saveText(k,next){const v=document.getElementById('t').value.trim();if(v.length<12){document.getElementById('b').insertAdjacentHTML('afterend','<div class="fb" style="color:var(--ko)">Prends un moment pour écrire une vraie réponse (quelques mots au moins).</div>');return}
const id=L[cur].id;S.p=S.p||{};S.p[id]=S.p[id]||{};S.p[id][k]=v;save();go(next)}
function choose(k){if(document.getElementById('b').dataset.d)return;pick=k;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j==k));document.getElementById('b').disabled=false}
function check(){const b=document.getElementById('b'),z=L[cur].z[qi];
if(b.dataset.d){qi++;pick=null;if(qi>=L[cur].z.length){S.p=S.p||{};S.p[L[cur].id]=S.p[L[cur].id]||{};go(4)}else render();return}
b.dataset.d=1;const ok=pick==z[2];if(ok)ans++;{S.p=S.p||{};const o=S.p[L[cur].id]=S.p[L[cur].id]||{};(o.qa=o.qa||[])[qi]=pick;if(qi==0)o.qa=[pick];save()}
document.querySelectorAll('.opt').forEach((o,j)=>{o.classList.remove('sel');if(j==z[2])o.classList.add('good');else if(j==pick)o.classList.add('bad')});
document.getElementById('fb').innerHTML=ok?'✅ Bonne réponse.':'Ce n\'est pas tout à fait ça — relis le passage, la réflexion compte aussi.';
b.textContent=qi+1>=L[cur].z.length?'Continuer →':'Question suivante →'}
function summary(){const n=nDone();$.innerHTML=`<button class="back" onclick="home()">← Parcours</button><h1>Ma synthèse</h1><p class="mu">${n==6?'Tu as parcouru toute la route de la création à l\'héritage. Voici ce que tu retiens et ce que tu as décidé.':'Voici ce que tu retiens jusqu\'ici.'}</p>`+L.filter(l=>S.done[l.id]).map(l=>{const p=S.p[l.id];return`<div class="card"><b>${l.ic} ${l.n}</b> <span class="mu">· quiz ${p.sc}/${l.z.length}</span><p><i>${e(p.s)}</i></p><p class="mu">Engagement : ${e(p.e)}</p></div>`}).join('')+(n==6?`<div class="syn">« J'ai appris une question que je dois désormais me poser. J'ai pris un engagement. Et si je veux aller plus loin, je peux le faire avec d'autres. »</div>`:'')}
function reset(){if(confirm('Effacer toute ta progression ?')){S={done:{}};save();home()}}
let PID;try{PID=localStorage.getItem('ceh_id');if(!PID){PID=crypto.randomUUID();localStorage.setItem('ceh_id',PID)}}catch(x){PID=null}
function GR(){try{return JSON.parse(localStorage.getItem('ceh_groups')||'{}')}catch(x){return{}}}
const ok=u=>u&&u.startsWith('https://');
function grpBtns(g,l){const t=ok(g.t),w=ok(g.w);if(!t&&!w)return`<button style="background:#2f7d4f" onclick="alert('Les groupes ${l.n} seront bientôt disponibles.')">🟢 Rejoindre un groupe<br><small>Bientôt disponible</small></button>`;
return`<div class="mu" style="margin-top:14px">🟢 Rejoindre le groupe ${l.n} : échanger et approfondir avec d'autres</div>`+(t?`<a class="btn" style="background:#2b8bc7;text-decoration:none" href="${e(g.t)}" target="_blank" rel="noopener">✈️ Sur Telegram</a>`:'')+(w?`<a class="btn" style="background:#25a244;text-decoration:none" href="${e(g.w)}" target="_blank" rel="noopener">💬 Sur WhatsApp</a>`:'')}
(async()=>{const C=window.CFG;if(!C||!C.url)return;try{const r=await fetch(C.url+'/rest/v1/rpc/get_groups',{method:'POST',headers:Object.assign({apikey:C.key,'Content-Type':'application/json'},C.key.startsWith('sb_')?{}:{Authorization:'Bearer '+C.key}),body:'{}'});if(r.ok)localStorage.setItem('ceh_groups',JSON.stringify(await r.json()))}catch(x){}})();
let tm;
function sync(){const C=window.CFG;if(!C||!C.url||!PID)return;clearTimeout(tm);tm=setTimeout(async()=>{try{const r=await fetch(C.url+'/rest/v1/rpc/upsert_participant',{method:'POST',headers:Object.assign({apikey:C.key,'Content-Type':'application/json'},C.key.startsWith('sb_')?{}:{Authorization:'Bearer '+C.key}),body:JSON.stringify({p_id:PID,p_name:S.name||'',p_data:{done:S.done,p:S.p||{}}})});if(!r.ok)throw 0}catch(x){}},800)}
addEventListener('online',sync);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
home();
</script></body></html>
