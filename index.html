<script>
// Liens des groupes : renseigner un lien (WhatsApp, Telegram, Discord…) par niveau
const GROUPS={m1:'',m2:'',m3:'',m4:'',m5:'',m6:''};
const CH="Origine → Relation → Identité → Statut → Position → Héritage";
let S={done:{}};try{S=JSON.parse(localStorage.getItem('ceh')||'{"done":{}}')}catch(e){}
const save=()=>{try{localStorage.setItem('ceh',JSON.stringify(S))}catch(e){}sync()};
const $=document.getElementById('app'),e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let curTab,cur=null,step=0,qi=0,pick=null,ans=0,tmp={},jx=0;
const ML=m=>L.map((l,i)=>i).filter(i=>L[i].m===m);
const cm=()=>S.cm>=0&&S.cm<M.length?S.cm:0;
const li=i=>ML(L[i].m).indexOf(i)+1;
const unlocked=i=>!L[i].soon&&(i==0||L[i].m!==L[i-1].m||!!S.done[L[i-1].id]);
const nDone=()=>ML(cm()).filter(i=>S.done[L[i].id]).length;
function setM(k){S.cm=k;save();home()}
const lvRow=i=>{const l=L[i],d=S.done[l.id];return`<div class="lv ${d?'':'lock'}" ${unlocked(i)?`onclick="start(${i})"`:''}><div class="ic">${d?'✓':li(i)}</div><div class="t"><b>${l.n}</b>${d||l.soon?`<small>${l.q}${l.soon?' · Bientôt disponible':''}</small>`:''}</div>${d?'<span class="ch">›</span>':LK}</div>`};
function home(){cur=null;const m=cm(),ix=ML(m),n=nDone(),nx=ix.find(i=>!S.done[L[i].id]&&!L[i].soon),real=ix.filter(i=>!L[i].soon).length;
const chips=M.length>1?`<div class="mu" role="button" tabindex="0" onclick="themes()" style="margin:14px 0 0;cursor:pointer">${e(M[m].n)} · ${e(M[m].t)} <u>changer</u></div>`:'';
shell(chips+`${nx!==undefined?`<div class="card hero"><div class="chain">Niveau ${ix.indexOf(nx)+1} sur ${ix.length}</div><h2>${L[nx].n}</h2><div class="mu">${L[nx].q}</div><button onclick="start(${nx})">${n?'Continuer le parcours':'Commencer le parcours'}</button></div>`:real?`<div class="card hero"><h2>${e(M[m].n)} terminé</h2><div class="mu">Tu as parcouru toutes les étapes de ce module.</div><button onclick="summary()">Voir ma synthèse</button></div>`:`<div class="card hero"><div class="chain">${e(M[m].n)}</div><h2>${e(M[m].t)}</h2><div class="mu">Ce module sera bientôt disponible.</div></div>`}
<div>${ix.map(i=>i===nx?'':lvRow(i)).join('')}</div>
<details class="set"><summary>Réglages</summary><div class="card"><b>Ton prénom (facultatif)</b><input id="nm" value="${e(S.name||'')}" placeholder="Prénom ou pseudo" onchange="S.name=this.value.trim();save()" style="width:100%;padding:10px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)"><div class="note">Tes réponses et engagements sont transmis de façon confidentielle à l'équipe du parcours pour améliorer les contenus.</div></div>
<button class="sec" onclick="reset()" style="font-size:14px">Réinitialiser ma progression</button></details>`,'p',nx)}
function groups(){const G=GR();shell(`<h1>Groupes</h1><p class="mu">Échange et approfondis chaque module avec d'autres participants.</p>`+M.map((m,k)=>{const q=ML(k).filter(i=>!L[i].soon),d=q.filter(i=>S.done[L[i].id]).length,g=G[m.id]||{},t=ok(g.t),w=ok(g.w);return`<div class="card"><b>${e(m.n)} · ${e(m.t)}</b>`+(!q.length?'<div class="mu">À venir bientôt.</div>':d<q.length?`<div class="mu">Termine d'abord le module (${d}/${q.length} niveaux) pour accéder à ce groupe.</div>`:(!t&&!w?'<div class="mu">Bientôt disponible.</div>':(t?`<a class="btn" style="background:#5aa9e0" href="${e(g.t)}" target="_blank" rel="noopener">Telegram</a>`:'')+(w?`<a class="btn" style="background:#4caf7a" href="${e(g.w)}" target="_blank" rel="noopener">WhatsApp</a>`:'')))+'</div>'}).join(''),'g')}
function summary(){const n=L.filter(l=>S.done[l.id]).length,full=false;cur=null;shell(`<h1>Ma synthèse</h1><p class="mu">${full?"Tu as parcouru toute la route de la création à l'héritage. Voici ce que tu retiens et ce que tu as décidé.":n?"Voici ce que tu retiens jusqu'ici.":"Ta synthèse apparaîtra ici dès ton premier niveau terminé."}</p>`+L.filter(l=>S.done[l.id]).map(l=>{const p=S.p[l.id];return`<div class="card"><b>${l.n}</b> ${(l.z||[]).length?`<span class="mu">· quiz ${p.sc}/${l.z.length}</span>`:''}<p><i>${e(p.s)}</i></p><p class="mu">Engagement : ${e(p.e)}</p>${p.u?`<p class="mu">Ma formulation : ${e(p.u)}</p>`:''}${l.nt&&l.df?`<p><b>${l.nt}</b> : ${l.df}</p>`:''}</div>`}).join('')+(full?`<div class="card"><div class="chain">${CH}</div>${L.filter(l=>l.m===0&&l.nt&&l.sq).map(l=>`<p><b>${l.nt}</b><br><span class="mu">${l.sq}</span></p>`).join('')}<p class="mu">Ces six notions forment une seule route : chacune prépare la suivante.</p></div><div class="syn">« J'ai appris une question que je dois désormais me poser. J'ai pris un engagement. Et si je veux aller plus loin, je peux le faire avec d'autres. »</div>`:''),'s')}
function themes(v){cur=null;if(v!==undefined){S.cm=+v;save()}const m=cm(),ix=ML(m),real=ix.filter(i=>!L[i].soon).length;
shell(`<h1>Thèmes</h1><p class="mu">Choisis un thème : ses niveaux d'étude apparaissent.</p><label for="th" class="chain">Thème</label><select id="th" onchange="themes(this.value)">${M.map((x,k)=>{const q=ML(k).filter(i=>!L[i].soon),d=q.filter(i=>S.done[L[i].id]).length;return`<option value="${k}" ${k==m?'selected':''}>${e(x.n)} · ${e(x.t)}${q.length?` (${d}/${q.length})`:' (à venir bientôt)'}</option>`}).join('')}</select><p class="mu">${real?`${real} niveau${real>1?'x':''} d'étude`:`${ix.length} niveaux d'étude · bientôt disponibles`}</p><div>${ix.map(lvRow).join('')}</div>`,'t')}
const txt=s=>String(s).replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const core=w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,''),tk=t=>String(t).match(/\S+/g)||[],isW=k=>/^\p{L}+$/u.test(k);
const STOP=new Set('avec dans pour mais donc ainsi cette sont être elle nous vous leur leurs tout tous toute toutes comme plus sans sous afin quand même aussi entre celui celle ceux'.split(' '));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let GM=null;
function VP(){const a=[];L.forEach(l=>{if(l.soon||!l.p)return;l.p.forEach((p,j)=>a.push({id:'p:'+l.id+':'+j,ref:txt(p[0]),t:txt(p[1]),m:l.m,e:'',k:[]}))});
VX.forEach(v=>{if(!v.on)return;const m=M.findIndex(x=>x.id===v.mod);if(m>=0)a.push({id:'x:'+v.id,ref:v.ref,t:v.t,ver:v.ver,m,e:v.e,k:v.k})});return a}
const vst=id=>{const o=(S.vp||{})[id];return!o?0:!o.a?1:o.s>=5?4:o.w>=3?3:2},VL=['Non découvert','À apprendre','En cours','Mémorisé','Maîtrisé durablement'],GAP=[1,2,4,8,15],
add=n=>dstr(new Date(Date.now()+n*864e5)),due=id=>{const o=(S.vp||{})[id];return!!(o&&o.d&&o.d<=dstr(new Date()))},vlab=id=>VL[vst(id)]+(due(id)?' · À réviser':'');
function rec(id,ok,rv){S.vp=S.vp||{};const o=S.vp[id]||(S.vp[id]={w:0,a:0}),t=S.stt=S.stt||{a:0,ok:0,rv:0};o.a++;o.t=Date.now();t.a++;if(ok)t.ok++;
if(rv){if(ok){t.rv++;o.s=(o.s||0)+1;o.d=o.s>=5?'':add(GAP[o.s])}else{o.s=Math.max(0,(o.s||0)-1);o.d=add(1)}}
else{o.w=ok?o.w+1:Math.max(0,o.w-1);if(o.w>=3&&o.s===undefined){o.s=0;o.d=add(GAP[0])}}save()}
function seen(id){S.vp=S.vp||{};if(!S.vp[id]){S.vp[id]={w:0,a:0};save()}}
function gen(v,ty,P){const w=tk(v.t),kz=(v.k||[]).map(nz),ok=n=>w.map((x,i)=>i).filter(i=>{const k=core(w[i]);return isW(k)&&k.length>=n&&!(n>4&&STOP.has(k.toLowerCase()))});
let c=ok(5);if(c.length<2)c=ok(4);const pr=c.filter(i=>kz.includes(nz(core(w[i])))),rest=shuf(c.filter(i=>!pr.includes(i))),hid=pr.concat(rest);
const blank=(i,f)=>{const k=core(w[i]),s=w[i].indexOf(k);return w[i].slice(0,s)+f+w[i].slice(s+k.length)};
if((ty=='c'||ty=='m')&&!hid.length)ty='r';
const q={ty,v};
if(ty=='c'){const i=hid[0],ans=core(w[i]);let d=[];const seenK={};seenK[nz(ans)]=1;
 shuf(P.filter(x=>x.id!=v.id).flatMap(x=>tk(x.t).map(core))).forEach(k=>{if(d.length<2&&isW(k)&&k.length>=4&&Math.abs(k.length-ans.length)<=3&&!seenK[nz(k)]){seenK[nz(k)]=1;d.push(k)}});
 ['Seigneur','royaume','sagesse','lumière','justice','alliance','montagne'].forEach(k=>{if(d.length<2&&!seenK[nz(k)]){seenK[nz(k)]=1;d.push(k)}});
 q.ch=shuf([ans,...d]);q.a=q.ch.indexOf(ans);q.txt=w.map((x,j)=>j==i?blank(i,'______'):x).join(' ');q.ans=ans}
if(ty=='m'){const n=Math.min(Math.max(2,Math.round(w.length*.25)),5,hid.length);q.h=hid.slice(0,n).sort((a,b)=>a-b);q.ans=q.h.map(i=>core(w[i]));q.w=w}
if(ty=='o'){const sz=Math.ceil(w.length/8),ch=[];for(let i=0;i<w.length;i+=sz)ch.push(w.slice(i,i+sz).join(' '));q.ch=ch;let o=ch.map((x,i)=>i);for(let t=0;t<6&&o.every((x,i)=>x==i)&&ch.length>1;t++)o=shuf(o);q.order=o;q.sel=[]}
if(ty=='e')q.x=1;
if(ty=='r'){let d=[];shuf([...new Set(P.map(x=>x.ref))]).forEach(r=>{if(d.length<2&&r!=v.ref)d.push(r)});['Psaume 23.1','Genèse 1.1','Jean 3.16','Matthieu 5.3'].forEach(r=>{if(d.length<2&&r!=v.ref&&!d.includes(r))d.push(r)});q.ch=shuf([v.ref,...d]);q.a=q.ch.indexOf(v.ref)}
return q}
const PTS={c:10,o:15,r:10,m:20,e:30,rev:10},LVLS=[['Découvreur',0],['Apprenti',100],['Persévérant',300],['Fidèle',600],['Enraciné',1000],['Gardien',1500]],
BDG=[['b1','🌱','Premier pas','Premier verset mémorisé',1],['b10','📖','Amoureux de la Parole','10 versets mémorisés',10],['b30','🛡️','Gardien de la Parole','30 versets mémorisés',30],['b50','🏆','Mémoire fidèle','50 versets mémorisés',50]];
const dstr=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function streak(){const d=new Set(S.days||[]);let n=0,t=new Date();if(!d.has(dstr(t)))t=new Date(t-864e5);while(d.has(dstr(t))){n++;t=new Date(t-864e5)}return n}
function award(v,ty,ok,rv){const td=dstr(new Date()),r={p:0,nb:[]};S.days=S.days||[];if(!S.days.includes(td))S.days=S.days.concat(td).slice(-120);S.pts=S.pts||0;S.pd=S.pd||{};
const kk=v.id+':'+(rv?'rev':ty);if(ok&&S.pd[kk]!=td){S.pd[kk]=td;r.p=PTS[rv?'rev':ty];S.pts+=r.p}
const mem=Object.keys(S.vp||{}).filter(id=>vst(id)>=3).length;S.bd=S.bd||{};BDG.forEach(b=>{if(mem>=b[4]&&!S.bd[b[0]]){S.bd[b[0]]=Date.now();r.nb.push(b)}});return r}
function dash(P){const p=S.pts||0,x=LVLS.reduce((a,l,i)=>p>=l[1]?i:a,0),nx=LVLS[x+1],pc=nx?Math.round((p-LVLS[x][1])/(nx[1]-LVLS[x][1])*100):100,n=f=>P.filter(v=>f(vst(v.id))).length,nd=P.filter(v=>due(v.id)).length,tt=S.stt||{a:0,ok:0,rv:0},sk=streak(),bd=S.bd||{};
return`<div class="card"><div class="chain">Niveau ${x+1} · ${LVLS[x][0]}</div><h2>${p} points</h2><div style="height:8px;border-radius:6px;background:var(--bd);margin:8px 0"><div style="height:8px;width:${pc}%;border-radius:6px;background:var(--ac)"></div></div><div class="mu" style="font-size:14px">${nx?`Encore ${nx[1]-p} points pour devenir ${nx[0]}`:'Niveau maximum atteint'}</div></div>
${nd?`<div class="card hero"><div class="chain">À réviser aujourd'hui</div><h2>${nd} verset${nd>1?'s':''}</h2><button onclick="gRev()">Réviser maintenant</button></div>`:''}<div class="card"><div class="chain">Mon tableau</div><p>🔎 ${n(z=>z>0)} découverts · ✅ ${n(z=>z>=3)} mémorisés · 📖 ${n(z=>z==2)} en cours · 🌟 ${n(z=>z==4)} maîtrisés durablement<br>🔁 ${nd} à réviser · ${tt.rv} révision${tt.rv>1?'s':''} réussie${tt.rv>1?'s':''}${tt.a?` · 🎯 ${Math.round(tt.ok/tt.a*100)} % de réussite`:''}<br>🔥 Série : ${sk} jour${sk>1?'s':''} de suite · 🏅 ${Object.keys(bd).length}/${BDG.length} badges</p></div>
<div class="card"><div class="chain">Mes badges</div>${BDG.map(b=>`<div style="display:flex;gap:12px;align-items:center;margin:10px 0;opacity:${bd[b[0]]?1:.35}"><span style="font-size:28px">${b[1]}</span><span><b>${b[2]}</b><br><small class="mu">${b[3]}</small></span></div>`).join('')}<div class="mu" style="font-size:13px">Ces récompenses t'encouragent à persévérer ; elles ne mesurent ni ta maturité spirituelle ni ta valeur devant DIEU.</div></div>`}
function games(){cur=null;GM=null;const P=VP(),n=f=>P.filter(v=>f(vst(v.id))).length;
