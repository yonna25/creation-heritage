<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{font:16px/1.5 Georgia,serif;margin:0;background:#faf6ef;color:#2b2a28}main{max-width:720px;margin:auto;padding:18px}.c{background:#fff;border:1px solid #e5dccf;border-radius:12px;padding:14px;margin:10px 0}button,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #ccc}input{width:100%;margin:4px 0}button{background:#9a5b2e;color:#fff;border:0;margin:4px 4px 4px 0}button.s{background:#fff;color:#2b2a28;border:1px solid #ccc}.m{color:#6f6a62;font-size:14px}</style></head><body><main>
<h1>Administration</h1><div id="a"><input id="k" type="password" placeholder="Clé admin"><button onclick="login()">Entrer</button></div><div id="o"></div></main>
<script src="config.js"></script><script src="content.js"></script><script>
const C=window.CFG,$=id=>document.getElementById(id),e=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let K=sessionStorage.getItem('ak')||'',pg=0,Q='';
async function rpc(f,b){const r=await fetch(C.url+'/rest/v1/rpc/'+f,{method:'POST',headers:Object.assign({apikey:C.key,'Content-Type':'application/json'},C.key.startsWith('sb_')?{}:{Authorization:'Bearer '+C.key}),body:JSON.stringify(b)});if(!r.ok)throw new Error('refus');const t=await r.text();return t?JSON.parse(t):null}
async function login(){K=$('k').value||K;try{await rpc('admin_stats',{p_key:K});sessionStorage.setItem('ak',K);$('a').style.display='none';menu();tab('p')}catch(x){$('o').textContent='Clé incorrecte ou configuration manquante.'}}
function menu(){$('o').innerHTML='<div><button onclick="tab(\'p\')">👥 Participants</button><button onclick="tab(\'g\')">💬 Groupes</button><button onclick="tab(\'k\')">🔑 Clé admin</button><button class="s" onclick="sessionStorage.clear();location.reload()">Quitter</button></div><div id="t"></div>'}
async function tab(n){$('t').textContent='Chargement…';try{if(n=='g')await tg();else if(n=='k')tk();else await tp()}catch(x){$('t').textContent='Erreur : '+x.message}}
async function tg(){const g=await rpc('get_groups',{})||{};$('t').innerHTML='<h2>Liens des groupes</h2><p class="m">Un lien Telegram et/ou WhatsApp par niveau (https://…). Laisse vide pour masquer le bouton.</p>'+L.map((l,i)=>`<div class="c"><b>${l.ic} ${l.n}</b><input id="t${i}" placeholder="Lien Telegram (https://t.me/…)" value="${e((g[l.id]||{}).t)}"><input id="w${i}" placeholder="Lien WhatsApp (https://chat.whatsapp.com/…)" value="${e((g[l.id]||{}).w)}"></div>`).join('')+'<button onclick="sg()">Enregistrer</button><span id="r" class="m"></span>'}
async function sg(){const g={};for(let i=0;i<L.length;i++){const t=$('t'+i).value.trim(),w=$('w'+i).value.trim();if((t&&!t.startsWith('https://'))||(w&&!w.startsWith('https://')))return $('r').textContent='Les liens doivent commencer par https://';g[L[i].id]={t,w}}
try{await rpc('admin_set_groups',{p_key:K,p_groups:g});$('r').textContent='✅ Enregistré'}catch(x){$('r').textContent='Échec'}}
function tk(){$('t').innerHTML='<h2>Changer la clé admin</h2><input id="n" type="password" placeholder="Nouvelle clé (12 caractères minimum)"><button onclick="ck()">Changer</button><span id="r" class="m"></span><p class="m">Clé perdue ? Voir le bas du fichier supabase_v2.sql : on la réinitialise depuis ton compte Supabase.</p>'}
async function ck(){try{await rpc('admin_change_key',{p_key:K,p_new:$('n').value});K=$('n').value;sessionStorage.setItem('ak',K);$('r').textContent='✅ Clé changée'}catch(x){$('r').textContent='Échec (12 caractères minimum)'}}
async function tp(){const s=await rpc('admin_stats',{p_key:K}),P=s.picks||[];
const st=L.map(l=>{const q=l.z.map((z,k)=>{const a=P.filter(p=>p.l==l.id&&p.q==k&&p.a!=null),t=a.reduce((x,p)=>x+p.n,0),g=a.filter(p=>p.a==z[2]).reduce((x,p)=>x+p.n,0);return t?Math.round(g/t*100)+'%':'–'});return`<div class="c"><b>${l.ic} ${l.n}</b> · ${(s.levels||{})[l.id]||0} terminé(s)<div class="m">Réussite par question : ${q.join(' · ')}</div></div>`}).join('');
const r=await rpc('admin_list',{p_key:K,p_limit:20,p_offset:pg*20,p_q:Q}),tot=r.length?r[0].total:0;
$('t').innerHTML=`<h2>${s.total} participant(s)</h2><button onclick="csv()">⬇️ Export CSV</button>${st}<h2>Fiches</h2><input id="q" placeholder="Rechercher un prénom" value="${e(Q)}" onchange="Q=this.value;pg=0;tp()">`+r.map(x=>`<div class="c"><b>${e(x.name||'Anonyme')}</b> <span class="m">· ${Object.keys(x.data.done||{}).length}/6 · ${new Date(x.updated_at).toLocaleDateString('fr')}</span>`+L.filter(l=>x.data.done&&x.data.done[l.id]).map(l=>{const p=x.data.p[l.id];return`<p><b>${l.n}</b> (${p.sc}/${l.z.length})<br>Réflexion : ${e(p.r)}<br>Retient : ${e(p.s)}<br>Engagement : ${e(p.e)}</p>`}).join('')+'</div>').join('')+
`<button class="s" ${pg?'':'disabled'} onclick="pg--;tp()">← Précédent</button><button class="s" ${(pg+1)*20<tot?'':'disabled'} onclick="pg++;tp()">Suivant →</button><span class="m">Page ${pg+1}</span>`}
async function csv(){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',rows=['participant,niveau,quiz,reflexion,synthese,engagement'];
for(let o=0;;o+=1000){const r=await rpc('admin_list',{p_key:K,p_limit:1000,p_offset:o,p_q:''});r.forEach(x=>L.forEach(l=>{if(x.data.done&&x.data.done[l.id]){const p=x.data.p[l.id];rows.push([q(x.name||x.id),q(l.n),p.sc,q(p.r),q(p.s),q(p.e)].join(','))}}));if(r.length<1000)break}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='participants.csv';a.click()}
if(K){$('k').value=K;login()}
</script></body></html>
