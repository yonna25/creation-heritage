<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{font:16px/1.5 Georgia,serif;margin:0;background:#faf6ef;color:#2b2a28}main{max-width:720px;margin:auto;padding:18px}.c{background:#fff;border:1px solid #e5dccf;border-radius:12px;padding:14px;margin:10px 0}button,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #ccc}input,textarea{width:100%;margin:4px 0;box-sizing:border-box}textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc}button{background:#9a5b2e;color:#fff;border:0;margin:4px 4px 4px 0}button.s{background:#fff;color:#2b2a28;border:1px solid #ccc}.m{color:#6f6a62;font-size:14px}</style></head><body><main>
<h1>Administration</h1><div id="a"><input id="k" type="password" placeholder="Clé admin"><button onclick="login()">Entrer</button></div><div id="o"></div></main>
<script src="config.js"></script><script src="content.js"></script><script>
const LV=()=>L.filter(l=>!l.soon),C=window.CFG,$=id=>document.getElementById(id),e=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let K=sessionStorage.getItem('ak')||'',pg=0,Q='';
async function rpc(f,b){const r=await fetch(C.url+'/rest/v1/rpc/'+f,{method:'POST',headers:Object.assign({apikey:C.key,'Content-Type':'application/json'},C.key.startsWith('sb_')?{}:{Authorization:'Bearer '+C.key}),body:JSON.stringify(b)});if(!r.ok)throw new Error('refus');const t=await r.text();return t?JSON.parse(t):null}
async function login(){K=$('k').value||K;try{await rpc('admin_stats',{p_key:K});try{applyCatalog(await rpc('get_catalog',{}))}catch(x){}sessionStorage.setItem('ak',K);$('a').style.display='none';menu();tab('p')}catch(x){$('o').textContent='Clé incorrecte ou configuration manquante.'}}
function menu(){$('o').innerHTML='<div><button onclick="tab(\'p\')">👥 Participants</button><button onclick="tab(\'m\')">📚 Modules</button><button onclick="tab(\'g\')">💬 Groupes</button><button onclick="tab(\'k\')">🔑 Clé admin</button><button class="s" onclick="sessionStorage.clear();location.reload()">Quitter</button></div><div id="t"></div>'}
async function tab(n){$('t').textContent='Chargement…';try{if(n=='g')await tg();else if(n=='m')await tm();else if(n=='k')tk();else await tp()}catch(x){$('t').textContent='Erreur : '+x.message}}
async function tg(){const g=await rpc('get_groups',{})||{};$('t').innerHTML='<h2>Liens des groupes</h2><p class="m">Un lien Telegram et/ou WhatsApp par niveau (https://…). Laisse vide pour masquer le bouton.</p>'+LV().map((l,i)=>`<div class="c"><b>${l.ic} ${l.n}</b><input id="t${i}" placeholder="Lien Telegram (https://t.me/…)" value="${e((g[l.id]||{}).t)}"><input id="w${i}" placeholder="Lien WhatsApp (https://chat.whatsapp.com/…)" value="${e((g[l.id]||{}).w)}"></div>`).join('')+'<button onclick="sg()">Enregistrer</button><span id="r" class="m"></span>'}
async function sg(){const g={};const V=LV();for(let i=0;i<V.length;i++){const t=$('t'+i).value.trim(),w=$('w'+i).value.trim();if((t&&!t.startsWith('https://'))||(w&&!w.startsWith('https://')))return $('r').textContent='Les liens doivent commencer par https://';g[V[i].id]={t,w}}
try{await rpc('admin_set_groups',{p_key:K,p_groups:g});$('r').textContent='✅ Enregistré'}catch(x){$('r').textContent='Échec'}}
function tk(){$('t').innerHTML='<h2>Changer la clé admin</h2><input id="n" type="password" placeholder="Nouvelle clé (12 caractères minimum)"><button onclick="ck()">Changer</button><span id="r" class="m"></span><p class="m">Clé perdue ? Voir le bas du fichier supabase_v2.sql : on la réinitialise depuis ton compte Supabase.</p>'}
async function ck(){try{await rpc('admin_change_key',{p_key:K,p_new:$('n').value});K=$('n').value;sessionStorage.setItem('ak',K);$('r').textContent='✅ Clé changée'}catch(x){$('r').textContent='Échec (12 caractères minimum)'}}
async function tp(){const s=await rpc('admin_stats',{p_key:K}),P=s.picks||[];
const st=LV().map(l=>{const q=(l.z||[]).map((z,k)=>{const a=P.filter(p=>p.l==l.id&&p.q==k&&p.a!=null),t=a.reduce((x,p)=>x+p.n,0),g=a.filter(p=>p.a==z[2]).reduce((x,p)=>x+p.n,0);return t?Math.round(g/t*100)+'%':'–'});return`<div class="c"><b>${l.ic} ${l.n}</b> · ${(s.levels||{})[l.id]||0} terminé(s)<div class="m">Réussite par question : ${q.join(' · ')}</div></div>`}).join('');
const r=await rpc('admin_list',{p_key:K,p_limit:20,p_offset:pg*20,p_q:Q}),tot=r.length?r[0].total:0;
$('t').innerHTML=`<h2>${s.total} participant(s)</h2><button onclick="csv()">⬇️ Export CSV</button>${st}<h2>Fiches</h2><input id="q" placeholder="Rechercher un prénom" value="${e(Q)}" onchange="Q=this.value;pg=0;tp()">`+r.map(x=>`<div class="c"><b>${e(x.name||'Anonyme')}</b> <span class="m">· ${Object.keys(x.data.done||{}).length}/${LV().length} · ${new Date(x.updated_at).toLocaleDateString('fr')}</span>`+L.filter(l=>x.data.done&&x.data.done[l.id]).map(l=>{const p=x.data.p[l.id];return`<p><b>${l.n}</b> (${p.sc}/${(l.z||[]).length})<br>Réflexion : ${e(p.r)}<br>Retient : ${e(p.s)}<br>Engagement : ${e(p.e)}</p>`}).join('')+'</div>').join('')+
`<button class="s" ${pg?'':'disabled'} onclick="pg--;tp()">← Précédent</button><button class="s" ${(pg+1)*20<tot?'':'disabled'} onclick="pg++;tp()">Suivant →</button><span class="m">Page ${pg+1}</span>`}
async function csv(){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',rows=['participant,niveau,quiz,reflexion,synthese,engagement'];
for(let o=0;;o+=1000){const r=await rpc('admin_list',{p_key:K,p_limit:1000,p_offset:o,p_q:''});r.forEach(x=>L.forEach(l=>{if(x.data.done&&x.data.done[l.id]){const p=x.data.p[l.id];rows.push([q(x.name||x.id),q(l.n),p.sc,q(p.r),q(p.s),q(p.e)].join(','))}}));if(r.length<1000)break}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='participants.csv';a.click()}
let CT=null,ED=null;
const lvOf=id=>CT.levels[id]||L0.find(l=>l.id==id),ln=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
const FD=[['n','Titre du niveau *','i'],['ic','Icône (émoji)','i'],['q','Question clé *','i'],['p','Passages bibliques : une ligne par passage, « Référence | texte »','t'],['r','Question de réflexion *','t'],['d','Questions pour approfondir (une par ligne)','t'],['rl','Phrase de fin d\u2019approfondissement (facultatif)','t'],['z','Quiz : une ligne par question, « Question | choix A ; choix B ; choix C | n° de la bonne réponse »','t'],['s','Synthèse : phrase à retenir *','t'],['nt','Notion à comprendre : titre','i'],['vq','Notion : question de compréhension','t'],['df','Notion : définition de référence','t'],['sm','Notion : à retenir','t']];
const toF=l=>({n:l.n||'',ic:l.ic||'',q:l.q||'',p:(l.p||[]).map(v=>v.join(' | ')).join('\n'),r:l.r||'',d:(l.d||[]).join('\n'),rl:l.rl||'',z:(l.z||[]).map(z=>z[0]+' | '+z[1].join(' ; ')+' | '+(z[2]+1)).join('\n'),s:l.s||'',nt:l.nt||'',vq:l.vq||'',df:l.df||'',sm:l.sm||''});
async function tm(){const c=await rpc('get_catalog',{})||{};CT={modules:JSON.parse(JSON.stringify(c.modules&&c.modules.length?c.modules:M0)),levels:c.levels||{}};drawM()}
function drawM(){ED=null;$('t').innerHTML='<h2>Modules et niveaux</h2><p class="m">Un module = un thème d\u2019étude avec ses niveaux. L\u2019ordre ci-dessous est celui de l\u2019application. Un module sans niveau s\u2019affiche « Bientôt disponible ».</p>'+CT.modules.map((m,k)=>`<div class="c"><input value="${e(m.n)}" oninput="CT.modules[${k}].n=this.value" placeholder="Nom (ex. Module 2)"><input value="${e(m.t)}" oninput="CT.modules[${k}].t=this.value" placeholder="Titre (ex. Consécration)"><label class="m"><input type="checkbox" style="width:auto" ${m.hide?'checked':''} onchange="CT.modules[${k}].hide=this.checked"> Masquer ce module</label>`+((m.lv||[]).map((id,j)=>{const l=lvOf(id)||{n:id};return`<div class="m">${j+1}. ${e(l.ic||'')} ${e(l.n)} <button class="s" onclick="eL(${k},${j})">✏️</button><button class="s" onclick="mv(${k},${j},-1)">↑</button><button class="s" onclick="mv(${k},${j},1)">↓</button><button class="s" onclick="rmL(${k},${j})">✕</button></div>`}).join('')||'<div class="m">Aucun niveau pour l\u2019instant.</div>')+`<button onclick="nL(${k})">+ Niveau</button><button class="s" onclick="mk(${k},-1)">↑ Module</button><button class="s" onclick="mk(${k},1)">↓ Module</button><button class="s" onclick="rmM(${k})">Supprimer</button></div>`).join('')+'<button onclick="nM()">+ Nouveau module</button><button onclick="svM()">Enregistrer</button><span id="r" class="m"></span>'}
const sw=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
function mv(k,j,d){sw(CT.modules[k].lv,j,d);drawM()}function mk(k,d){sw(CT.modules,k,d);drawM()}
function rmL(k,j){CT.modules[k].lv.splice(j,1);drawM()}function rmM(k){if(confirm('Supprimer ce module ? (La progression des participants n\u2019est pas effacée.)')){CT.modules.splice(k,1);drawM()}}
function nM(){CT.modules.push({n:'Module '+(CT.modules.length+1),t:'',lv:[]});drawM()}
function eL(k,j){ED={k,id:CT.modules[k].lv[j]};drawE()}function nL(k){ED={k,id:null};drawE()}
function drawE(){const f=toF(ED.id?lvOf(ED.id)||{}:{});$('t').innerHTML='<h2>'+(ED.id?'Modifier le niveau':'Nouveau niveau')+'</h2><p class="m">Les champs avec * sont obligatoires. Quiz et « Notion » sont facultatifs : s\u2019ils sont vides, ces étapes sont sautées. La notion se remplit en entier ou pas du tout.</p>'+FD.map(([k,lb,ty])=>`<label class="m">${lb}</label>`+(ty=='i'?`<input id="f_${k}" value="${e(f[k])}">`:`<textarea id="f_${k}" rows="${'pdz'.includes(k)?5:3}">${e(f[k])}</textarea>`)).join('')+'<button onclick="okL()">Valider</button><button class="s" onclick="drawM()">Annuler</button><div id="r" class="m"></div>'}
function okL(){const v={},bad=m=>($('r').textContent=m,1);FD.forEach(([k])=>v[k]=$('f_'+k).value.trim());
if(!v.n||!v.q||!v.r||!v.s)return bad('Titre, question clé, réflexion et synthèse sont obligatoires.');
const o={n:v.n,ic:v.ic||'📖',q:v.q,r:v.r,s:v.s};
const p=ln(v.p).map(x=>{const a=x.split('|');return[a[0].trim(),a.slice(1).join('|').trim()]});if(p.some(x=>!x[0]||!x[1]))return bad('Chaque passage doit être de la forme « Référence | texte ».');if(p.length)o.p=p;
const d=ln(v.d);if(d.length){o.d=d;if(v.rl)o.rl=v.rl}
const z=ln(v.z).map(x=>{const a=x.split('|'),c=(a[1]||'').split(';').map(y=>y.trim()).filter(Boolean);return[a[0].trim(),c,parseInt(a[2])-1]});if(z.some(x=>!x[0]||x[1].length<2||!(x[2]>=0&&x[2]<x[1].length)))return bad('Quiz : « Question | choix A ; choix B | n° de la bonne réponse » (au moins 2 choix).');if(z.length)o.z=z;
const nn=['nt','vq','df','sm'].filter(k=>v[k]);if(nn.length&&nn.length<4)return bad('La notion se remplit en entier (4 champs) ou pas du tout.');if(nn.length)['nt','vq','df','sm'].forEach(k=>o[k]=v[k]);
const id=ED.id||((v.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'niveau')+'-'+Math.random().toString(36).slice(2,5));
CT.levels[id]=o;if(!ED.id)CT.modules[ED.k].lv.push(id);drawM()}
async function svM(){const mods=CT.modules;if(mods.some(m=>!String(m.t||'').trim()))return $('r').textContent='Chaque module doit avoir un titre.';
const used={};mods.forEach(m=>(m.lv||[]).forEach(id=>{if(CT.levels[id])used[id]=CT.levels[id]}));
try{await rpc('admin_set_catalog',{p_key:K,p_catalog:{modules:mods,levels:used}});applyCatalog({modules:mods,levels:used});$('r').textContent='✅ Enregistré : visible dans l\u2019app au prochain chargement.'}catch(x){$('r').textContent='Échec : exécute d\u2019abord supabase_v3.sql dans Supabase.'}}
if(K){$('k').value=K;login()}
</script></body></html>
